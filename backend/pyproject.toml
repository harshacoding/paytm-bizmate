[project]
name = "bizmate-backend"
version = "0.1.0"
description = "Paytm BizMate local prototype backend"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "filelock>=3.16,<4",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bizmate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/bizmate/api/routes.py" = ["B008"]
